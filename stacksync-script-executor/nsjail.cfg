name: "PythonSandbox"
description: "Sandbox for Python script execution"
mode: ONCE
time_limit: 5
max_cpus: 1
hostname: "sandbox"

rlimit_as: 536870912
rlimit_cpu: 5

clone_newnet: true

mount {
  src: "/app"
  dst: "/app"
  is_bind: true
  rw: false
}

mount {
  src: "/tmp"
  dst: "/tmp"
  is_bind: true
  rw: false
}

mount {
  src: "/dev/null"
  dst: "/dev/null"
  is_bind: true
}

mount {
  src: "/dev/urandom"
  dst: "/dev/urandom"
 is_bind: true
}

mount {
  src: "/dev/zero"
  dst: "/dev/zero"
  is_bind: true
}

mount {
  src: "/usr"
  dst: "/usr"
  is_bind: true
  rw: false
}

mount {
  src: "/lib"
  dst: "/lib"
  is_bind: true
  rw: false
}

mount {
  src: "/lib64"
  dst: "/lib64"
  is_bind: true
  rw: false
}

mount {
  src: "/bin"
  dst: "/bin"
  is_bind: true
  rw: false
}

mount {
  src: "/usr/local/lib"
  dst: "/usr/local/lib"
  is_bind: true
  rw: false
}
